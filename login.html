<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Nha Khoa Smile</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 4C6.4 4 4 6.6 4 10c0 2.3.9 3.8 1.6 5.8.9 2.6.9 5.3 1.7 8 .5 1.7 1.300 3.700 2.800 3.700 1.900 0 2.100-3.800 3.200-6.400.4-.9 1-1.300 1.700-1.300s1.300.4 1.700 1.300c1.100 2.600 1.300 6.400 3.200 6.400 1.500 0 2.300-2 2.800-3.700.8-2.700.8-5.400 1.700-8C27.100 13.800 28 12.300 28 10c0-3.400-2.400-6-6-6-2.300 0-3.500 1.100-6 1.100S12.300 4 10 4z" fill="#9fb6ff"/></svg><span>Nha Khoa Smile</span></a>
      <h1>Đăng nhập</h1>
      <p class="sub">Dùng email và mật khẩu đã đăng ký.</p>
      <div id="msg" role="alert" hidden></div>
      <form id="login-form" novalidate>
        <div class="field"><input id="email" name="email" type="email" placeholder=" " autocomplete="username" required><label for="email">Email</label><small class="err"></small></div>
        <div class="field" data-pw><input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required><label for="password">Mật khẩu</label><small class="err"></small></div>
        <div class="auth-links"><span></span><a href="forgot-password.html">Quên mật khẩu?</a></div>
        <button class="btn btn-block" type="submit">Đăng nhập</button>
      </form>
      <p class="auth-foot">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </div>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
